services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose: ["8000"]
    # Las cookies (X_AUTH_TOKEN/X_CT0) y el resto de secretos vienen del .env local
    # (git-ignored). Los paths se fijan acá a rutas ABSOLUTAS del contenedor; como
    # `environment` precede a `env_file`, overridean los paths relativos del .env.
    env_file: ../.env
    environment:
      # El ledger del gate va en SU PROPIO volumen, separado del SQLite de datos
      # (regla #1 de CLAUDE.md: sobrevive a que se borre/regenere la base de tweets).
      AUDIT_DB_PATH: /data/audit/ledger.db
      DATA_DB_PATH: /data/app/tweets.db
      CSV_DIR: /data/app/csv
      ACCOUNTS_DB_PATH: /data/app/accounts.db
    volumes:
      - audit-ledger:/data/audit
      - app-data:/data/app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

volumes:
  audit-ledger:   # ledger de auditoría del Compliance Gate (persistente, aislado)
  app-data:       # tweets.db + CSV + accounts.db
