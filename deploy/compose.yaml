# Podman sin root: `podman compose -f deploy/compose.yaml up --build`, en http://localhost:8080.
# `restart: unless-stopped` vuelve a levantar los contenedores después de un reinicio solo si está
# habilitado `podman-restart.service` (systemctl --user enable podman-restart.service).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    expose: ["8000"]
    # Las cookies (X_AUTH_TOKEN/X_CT0) y el resto de secretos vienen del .env local
    # (git-ignored). Los paths se fijan acá a rutas ABSOLUTAS del contenedor; como
    # `environment` precede a `env_file`, overridean los paths relativos del .env.
    env_file: ../.env
    environment:
      # El ledger del gate va en SU PROPIO volumen, separado del SQLite de datos
      # (regla 1 de docs/PLAN.md: sobrevive a que se borre/regenere la base de tweets).
      AUDIT_DB_PATH: /data/audit/ledger.db
      DATA_DB_PATH: /data/app/tweets.db
      CSV_DIR: /data/app/csv
      # Los CSV de la captura (POST /export). Sin esto quedaba el relativo del .env,
      # /app/data/captures: /app es de root y el proceso corre como `app`, así que el
      # export fallaba con 500 (y lo escrito se perdía al recrear el contenedor).
      CAPTURES_DIR: /data/app/captures
      ACCOUNTS_DB_PATH: /data/app/accounts.db
    volumes:
      - audit-ledger:/data/audit
      - app-data:/data/app
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:1.30-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

volumes:
  audit-ledger:   # ledger de auditoría del Compliance Gate (persistente, aislado)
  app-data:       # tweets.db + CSV + accounts.db
