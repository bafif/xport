# Reverse-proxy del FastAPI. El CORS lo maneja FastAPI (CORSMiddleware), NUNCA
# acá: no duplicar headers CORS entre Nginx y la app (regla de CLAUDE.md).
server {
    listen 80;
    server_name _;

    client_max_body_size 1m;  # los POST /jobs son chicos (JSON con cuentas + fechas)

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los jobs corren en background (POST /jobs responde al toque), pero la
        # descarga de un CSV grande puede tardar: timeouts holgados.
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
