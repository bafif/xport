<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xport</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>xport</h1>
        <p class="sub">Tweets → CSV (captura in-page)</p>
      </header>

      <form id="capture-form" autocomplete="off">
        <label>
          Servicio local
          <input id="base" type="url" placeholder="http://localhost:8000" required />
        </label>
        <label>
          Cuenta
          <input id="account" type="text" placeholder="nasa" required />
        </label>
        <div class="row">
          <label
            >Desde
            <input
              id="since"
              type="text"
              inputmode="numeric"
              placeholder="AAAA-MM-DD"
              pattern="\d{4}-\d{2}-\d{2}"
              maxlength="10"
              required
          /></label>
          <label
            >Hasta
            <input
              id="until"
              type="text"
              inputmode="numeric"
              placeholder="AAAA-MM-DD"
              pattern="\d{4}-\d{2}-\d{2}"
              maxlength="10"
              required
          /></label>
        </div>
        <button id="capture-start" type="submit">Capturar ▶</button>
        <div class="row">
          <button id="capture-stop" type="button" class="secondary">Detener ⏹</button>
          <button id="export" type="button" class="secondary">Exportar CSV</button>
        </div>
      </form>

      <section id="gate" class="gate" hidden></section>
      <section id="counts" class="gate" hidden></section>
      <p id="status" class="sub" hidden></p>
      <section id="export-status" class="status" hidden></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
