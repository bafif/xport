<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xport</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <!-- Los textos salen de locales/ (lib/i18n.ts): cada elemento dice su clave en data-i18n
       y main.ts los llena en el idioma de la persona. -->
  <body>
    <main id="app">
      <header>
        <div class="top">
          <h1><img src="/icon/32.png" alt="" width="22" height="22" />xport</h1>
          <select id="lang" data-i18n-aria-label="popup.lang">
            <option value="es" lang="es" data-i18n="lang.es"></option>
            <option value="en" lang="en" data-i18n="lang.en"></option>
          </select>
        </div>
        <p class="sub" data-i18n="popup.subtitle"></p>
      </header>

      <form id="capture-form" autocomplete="off">
        <label>
          <span data-i18n="popup.service"></span>
          <input id="base" type="url" placeholder="http://localhost:8000" required />
        </label>
        <label>
          <span data-i18n="popup.account"></span>
          <input id="account" type="text" placeholder="nasa" required />
        </label>
        <div class="row">
          <label
            ><span data-i18n="popup.since"></span>
            <input
              id="since"
              type="text"
              inputmode="numeric"
              data-i18n-placeholder="popup.date_format"
              pattern="\d{4}-\d{2}-\d{2}"
              maxlength="10"
              required
          /></label>
          <label
            ><span data-i18n="popup.until"></span>
            <input
              id="until"
              type="text"
              inputmode="numeric"
              data-i18n-placeholder="popup.date_format"
              pattern="\d{4}-\d{2}-\d{2}"
              maxlength="10"
              required
          /></label>
        </div>
        <button id="capture-start" type="submit" data-i18n="popup.capture"></button>
        <div class="row">
          <button id="capture-stop" type="button" class="secondary" data-i18n="popup.stop"></button>
          <button id="export" type="button" class="secondary" data-i18n="popup.export"></button>
        </div>
        <label class="check"
          ><input id="excel" type="checkbox" /> <span data-i18n="popup.excel"></span>
          <small data-i18n="popup.excel_hint"></small></label
        >
        <button
          id="reset"
          type="button"
          class="secondary danger"
          data-i18n="popup.reset"
        ></button>
      </form>

      <p class="sub">
        <a
          id="page-link"
          href="http://localhost:8000/"
          target="_blank"
          rel="noreferrer"
          data-i18n="popup.page_link"
        ></a
        ><span data-i18n="popup.page_hint"></span>
      </p>

      <p id="paused" class="paused" hidden></p>
      <section id="gate" class="gate" hidden></section>
      <section id="counts" class="gate" hidden></section>
      <p id="status" class="sub" hidden></p>
      <section id="export-status" class="status" hidden></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
