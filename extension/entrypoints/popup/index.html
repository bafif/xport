<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xport</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>xport</h1>
        <p class="sub">Tweets → CSV vía el servicio local</p>
      </header>

      <form id="job-form" autocomplete="off">
        <label>
          API base
          <input id="base" type="url" placeholder="http://localhost:8080" required />
        </label>
        <label>
          Cuentas <small>(coma o espacio)</small>
          <input id="accounts" type="text" placeholder="nasa, esa" required />
        </label>
        <div class="row">
          <label>Desde<input id="since" type="date" required /></label>
          <label>Hasta<input id="until" type="date" required /></label>
        </div>
        <button id="submit" type="submit">Extraer</button>
      </form>

      <section id="gate" class="gate" hidden></section>
      <section id="status" class="status" hidden></section>
      <p id="error" class="error" hidden></p>

      <hr />

      <section class="capture">
        <h2>Captura in-page</h2>
        <label class="check">
          <input id="capture-toggle" type="checkbox" />
          Capturar de x.com (navegá <code>from:user since: until:</code> y scrolleá)
        </label>
        <div class="row">
          <button id="scroll-start" type="button">Auto-scroll ▶</button>
          <button id="scroll-stop" type="button" class="secondary">Detener ⏹</button>
        </div>
        <p id="scroll-status" class="sub" hidden></p>
        <section id="counts" class="gate" hidden></section>

        <form id="export-form" autocomplete="off">
          <label>
            Cuenta a exportar
            <input id="exp-account" type="text" placeholder="nasa" required />
          </label>
          <div class="row">
            <label>Desde<input id="exp-since" type="date" required /></label>
            <label>Hasta<input id="exp-until" type="date" required /></label>
          </div>
          <button id="export" type="submit">Exportar CSV</button>
        </form>
        <section id="export-status" class="status" hidden></section>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
