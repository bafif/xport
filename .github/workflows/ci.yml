# Lint, types and tests for the Python service; Podman builds of the service
# image (Alpine) and of the browser extension; the installable package on Linux,
# Windows and macOS (Linux also for musl, in an Alpine container), with a smoke test. GitHub-hosted runners only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: service image (Alpine)
        run: podman build -f deploy/Containerfile -t xport:ci .
      - name: extension (Chrome MV3 + Firefox MV2)
        run: >-
          bash deploy/extension-build.sh
      - run: ls extension/dist/chrome-mv3/manifest.json extension/dist/firefox-mv2/manifest.json

  # The installable package (item 14 of docs/PLAN.md) on the three systems: it is built with
  # its own Python, and the smoke test starts its service, checks that it answers and closes
  # it. Each system builds its own copy of the extension with Node (no Podman on Windows or
  # macOS runners).
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: extension (Chrome MV3)
        shell: bash
        working-directory: extension
        run: npm ci && npm run build:chrome
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: package + smoke test
        shell: bash
        run: uv run python deploy/bundle/build.py --smoke

  # The same package for Alpine and the other Linux with musl (xport-<version>-linux-x86_64-musl), built and tested
  # inside Alpine: there uv downloads the CPython for musl and the dependencies come as musllinux wheels. Only this
  # job runs in a container. The image carries the uv the repo pins; Node is Alpine's (the extension it builds is
  # the same static files).
  bundle-musl:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:0.11.19-alpine
    steps:
      - run: apk add --no-cache bash git nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: extension (Chrome MV3)
        working-directory: extension
        run: npm ci && npm run build:chrome
      - name: package + smoke test
        run: uv run python deploy/bundle/build.py --smoke
