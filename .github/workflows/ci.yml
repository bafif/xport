# Lint, types and tests for the Python service; Docker builds of the service
# image (Alpine) and of the browser extension. GitHub-hosted runners only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: service image (Alpine)
        run: docker build -f deploy/Dockerfile -t xport:ci .
      - name: extension (Chrome MV3 + Firefox MV2)
        run: docker build -f deploy/extension.Dockerfile -o extension/dist extension
      - run: ls extension/dist/chrome-mv3/manifest.json extension/dist/firefox-mv2/manifest.json
