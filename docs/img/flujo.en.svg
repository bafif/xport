<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="How it works">
<title>How it works</title>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b98a5"/></marker></defs>
<rect width="900" height="340" rx="16" fill="#161d26"/>
<text x="24" y="38" font-size="18" fill="#e7e9ea" text-anchor="start" font-weight="bold">How it works</text>
<rect x="24" y="62" width="190" height="124" rx="12" fill="#1e2732" stroke="#1d9bf0" stroke-width="1.5"/>
<text x="40" y="92" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">x.com</text>
<text x="40" y="116" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">in your browser,</text>
<text x="40" y="135" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">with your session</text>
<rect x="254" y="62" width="210" height="124" rx="12" fill="#1e2732" stroke="#38444d" stroke-width="1.5"/>
<text x="270" y="92" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">Extension</text>
<text x="270" y="116" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">scrolls the search and</text>
<text x="270" y="135" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">copies what x.com</text>
<text x="270" y="154" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">already downloaded</text>
<rect x="504" y="62" width="180" height="124" rx="12" fill="#1e2732" stroke="#38444d" stroke-width="1.5"/>
<text x="520" y="92" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">Local service</text>
<text x="520" y="116" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">parses and stores</text>
<text x="520" y="135" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">without repeats</text>
<rect x="724" y="62" width="152" height="124" rx="12" fill="#1e2732" stroke="#38444d" stroke-width="1.5"/>
<text x="740" y="92" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">CSV</text>
<text x="740" y="116" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">one per account</text>
<line x1="218" y1="124" x2="248" y2="124" stroke="#8b98a5" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="468" y1="124" x2="498" y2="124" stroke="#8b98a5" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="688" y1="124" x2="718" y2="124" stroke="#8b98a5" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="494" y="222" width="200" height="96" rx="12" fill="#1e2732" stroke="#ffd400" stroke-width="1.5"/>
<text x="510" y="252" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">24-hour cap</text>
<text x="510" y="276" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">counts every post seen</text>
<text x="510" y="295" font-size="13" fill="#8b98a5" text-anchor="start" font-weight="normal">and stops at 900,000</text>
<line x1="594" y1="190" x2="594" y2="218" stroke="#8b98a5" stroke-width="2" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
<path d="M490,270 L359,270 L359,192" fill="none" stroke="#ffd400" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
<text x="348" y="258" font-size="13" fill="#ffd400" text-anchor="end" font-weight="normal">if it cannot count it,</text>
<text x="348" y="276" font-size="13" fill="#ffd400" text-anchor="end" font-weight="normal">the capture stops</text>
</svg>
