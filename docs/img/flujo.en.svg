<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="How it works">
<title>How it works</title>
<defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71767b"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="339" rx="16" fill="#000000" stroke="#2f3336"/>
<text x="24" y="38" font-size="18" fill="#e7e9ea" text-anchor="start" font-weight="bold">How it works</text>
<rect x="24" y="62" width="190" height="124" rx="12" fill="#16181c" stroke="#2f3336" stroke-width="1.5"/>
<text x="40" y="92" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">x.com</text>
<text x="40" y="116" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">in your browser,</text>
<text x="40" y="135" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">with your session</text>
<rect x="254" y="62" width="210" height="124" rx="12" fill="#16181c" stroke="#2f3336" stroke-width="1.5"/>
<text x="270" y="92" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">Extension</text>
<text x="270" y="116" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">scrolls the search and</text>
<text x="270" y="135" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">copies what x.com</text>
<text x="270" y="154" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">already downloaded</text>
<rect x="428" y="76" width="22" height="22" rx="4.8125" fill="#000"/>
<polygon transform="translate(430.75 78.75) scale(0.6875)" points="1,1 9,1 9,5 12,8 15.25,4.75 12.5,2 12.5,1 23,1 23,11.5 22,11.5 19.25,8.75 16,12 19,15 23,15 23,23 15,23 15,19 12,16 9,19 9,23 1,23 1,15 5,15 8,12 5,9 1,9" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="504" y="62" width="180" height="124" rx="12" fill="#16181c" stroke="#2f3336" stroke-width="1.5"/>
<text x="520" y="92" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">Local service</text>
<text x="520" y="116" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">parses and stores</text>
<text x="520" y="135" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">without repeats</text>
<rect x="648" y="76" width="22" height="22" rx="4.8125" fill="#000"/>
<polygon transform="translate(650.75 78.75) scale(0.6875)" points="1,1 9,1 9,5 12,8 15.25,4.75 12.5,2 12.5,1 23,1 23,11.5 22,11.5 19.25,8.75 16,12 19,15 23,15 23,23 15,23 15,19 12,16 9,19 9,23 1,23 1,15 5,15 8,12 5,9 1,9" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="724" y="62" width="152" height="124" rx="12" fill="#16181c" stroke="#1d9bf0" stroke-width="1.5"/>
<text x="740" y="92" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">CSV</text>
<text x="740" y="116" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">one per account</text>
<path d="M850,62 H864 A12,12 0 0 1 876,74 V88 Z" fill="#1d9bf0"/>
<line x1="218" y1="124" x2="248" y2="124" stroke="#71767b" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="468" y1="124" x2="498" y2="124" stroke="#71767b" stroke-width="2" marker-end="url(#flecha)"/>
<line x1="688" y1="124" x2="718" y2="124" stroke="#71767b" stroke-width="2" marker-end="url(#flecha)"/>
<rect x="494" y="222" width="200" height="96" rx="12" fill="#16181c" stroke="#ffd400" stroke-width="1.5"/>
<text x="510" y="252" font-size="15" fill="#e7e9ea" text-anchor="start" font-weight="bold">24-hour cap</text>
<text x="510" y="276" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">counts every post seen</text>
<text x="510" y="295" font-size="13" fill="#71767b" text-anchor="start" font-weight="normal">and stops at 900,000</text>
<line x1="594" y1="190" x2="594" y2="218" stroke="#71767b" stroke-width="2" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
<path d="M490,270 L359,270 L359,192" fill="none" stroke="#ffd400" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
<text x="348" y="258" font-size="13" fill="#ffd400" text-anchor="end" font-weight="normal">if it cannot count it,</text>
<text x="348" y="276" font-size="13" fill="#ffd400" text-anchor="end" font-weight="normal">the capture stops</text>
</svg>
